<style>/* ===========================================================
   TABBI DESIGN TOKENS
   Editorial, warm, gender-neutral, Kenya-first personal finance.
=========================================================== */

:root{
  --bg: #F8F1F2;
  --card: #FFFCFA;
  --card-raised: #FFFFFF;
  --ink: #2B211F;
  --ink-soft: #56504E;
  --ink-faint: #817674;
  --rose: #C98291;
  --plum: #69445F;
  --sage: #82947B;
  --apricot: #E6B88A;
  --blush: #F1D9DE;
  --warn: #A95C67;
  --border: rgba(43,33,31,0.10);
  --shadow: 0 1px 2px rgba(43,33,31,0.06), 0 8px 24px rgba(43,33,31,0.06);
  --shadow-lift: 0 2px 4px rgba(43,33,31,0.08), 0 16px 40px rgba(43,33,31,0.10);
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 24px;
  --radius-pill: 999px;

  --font-display: "DM Serif Display", Georgia, serif;
  --font-body: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-hand: "Caveat", cursive;

  --income: #82947B;
  --expense: #A95C67;
  --sidebar-w: 244px;
}

html[data-theme="dark"]{
  --bg: #1C1614;
  --card: #241D1B;
  --card-raised: #2B221F;
  --ink: #F3E9E4;
  --ink-soft: #CDBFB9;
  --ink-faint: #8E8079;
  --rose: #D89AA6;
  --plum: #B48CA8;
  --sage: #9FB196;
  --apricot: #E9C69B;
  --blush: #3A2B2C;
  --warn: #D08893;
  --border: rgba(243,233,228,0.10);
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  --shadow-lift: 0 2px 4px rgba(0,0,0,0.35), 0 16px 40px rgba(0,0,0,0.4);
}

*{ box-sizing: border-box; }
html,body,#root{ height:100%; }
body{
  margin:0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
  -webkit-font-smoothing: antialiased; transition: background .25s ease, color .25s ease;
}
h1,h2,h3,.font-display{ font-family: var(--font-display); font-weight:400; letter-spacing:-0.01em; }
.font-hand{ font-family: var(--font-hand); }
a{ color: inherit; }
button{ font-family: inherit; }
::selection{ background: var(--blush); color: var(--ink); }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline: 2px solid var(--plum); outline-offset: 2px; border-radius: var(--radius-s);
}
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }
.container{ max-width: 1180px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 760px){ .container{ padding: 0 16px; } }
.visually-hidden{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

/* ===========================================================
   TABBI COMPONENT STYLES
=========================================================== */

.tb-app{ display:flex; min-height:100vh; }
.tb-sidebar{
  width: var(--sidebar-w); flex-shrink:0; background: var(--card);
  border-right: 1px solid var(--border); padding: 22px 14px;
  display:flex; flex-direction:column; gap: 4px; position: sticky; top:0; height:100vh; overflow-y:auto;
}
.tb-brand{ font-family: var(--font-display); font-size: 26px; padding: 6px 12px 18px; color: var(--plum); }
.tb-navitem{
  display:flex; align-items:center; gap:10px; padding: 10px 12px; border-radius: var(--radius-m);
  color: var(--ink-soft); text-decoration:none; cursor:pointer; font-size:14.5px; border:none; background:none; text-align:left; width:100%;
}
.tb-navitem:hover{ background: var(--blush); color: var(--ink); }
.tb-navitem.active{ background: var(--plum); color: #fff; }
.tb-navitem .em{ font-size:16px; width:20px; text-align:center; }
.tb-sidebar-foot{ margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }

.tb-main{ flex:1; min-width:0; }
.tb-topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding: 18px 28px; position:sticky; top:0; background: var(--bg); z-index: 5; border-bottom: 1px solid transparent;
}
.tb-page{ padding: 8px 28px 56px; }

.tb-mobile-nav{ display:none; }
.tb-menu-btn{ display:none; }

@media (max-width: 900px){
  .tb-sidebar{ display:none; }
  .tb-menu-btn{ display:inline-flex; }
  .tb-page{ padding: 8px 16px 90px; }
  .tb-topbar{ padding: 14px 16px; }
  .tb-mobile-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--border); z-index:20; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    overflow-x:auto; gap:2px;
  }
  .tb-mobile-nav .tb-navitem{ flex-direction:column; gap:2px; font-size:10.5px; padding:8px 10px; min-width:64px; }
  .tb-mobile-drawer{ position:fixed; inset:0; z-index:30; background: rgba(0,0,0,.35); }
  .tb-mobile-drawer-panel{ position:absolute; left:0; top:0; bottom:0; width:78%; max-width:300px; background:var(--card); padding:20px 14px; overflow-y:auto; }
}

.tb-card{ background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 20px; box-shadow: var(--shadow); }
.tb-grid{ display:grid; gap:16px; }
.tb-grid-2{ grid-template-columns: 1fr 1fr; }
.tb-grid-3{ grid-template-columns: repeat(3,1fr); }
.tb-grid-4{ grid-template-columns: repeat(4,1fr); }
@media (max-width: 900px){ .tb-grid-2,.tb-grid-3,.tb-grid-4{ grid-template-columns: 1fr; } }

.tb-btn{ border-radius: var(--radius-pill); border: 1px solid transparent; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition: transform .12s ease, opacity .12s ease, background .15s ease; }
.tb-btn:active{ transform: scale(0.98); }
.tb-btn-md{ padding: 11px 20px; font-size: 14.5px; }
.tb-btn-sm{ padding: 7px 14px; font-size: 13px; }
.tb-btn-lg{ padding: 14px 26px; font-size: 16px; }
.tb-btn-full{ width:100%; }
.tb-btn-primary{ background: var(--plum); color: #fff; }
.tb-btn-primary:hover{ opacity:.92; }
.tb-btn-secondary{ background: var(--blush); color: var(--ink); }
.tb-btn-ghost{ background: transparent; color: var(--ink-soft); border-color: var(--border); }
.tb-btn-danger{ background: var(--warn); color: #fff; }
.tb-btn:disabled{ opacity:.5; cursor:not-allowed; }

.tb-iconbtn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--card); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-soft); }
.tb-iconbtn:hover{ background:var(--blush); color:var(--ink); }
.tb-iconbtn.active{ background:var(--plum); color:#fff; border-color:var(--plum); }

.tb-fab-add{ position:fixed; right:28px; bottom:28px; z-index:15; background: var(--plum); color:#fff; border:none; border-radius: var(--radius-pill); padding: 15px 22px; font-weight:700; font-size:15px; box-shadow: var(--shadow-lift); cursor:pointer; display:flex; align-items:center; gap:8px; }
@media (max-width: 900px){ .tb-fab-add{ right:16px; bottom:78px; padding:13px 18px; } }

.tb-progress-track{ width:100%; background: var(--border); border-radius: 99px; overflow:hidden; }
.tb-progress-fill{ height:100%; border-radius:99px; transition: width .5s ease; }

.tb-badge{ display:inline-block; padding: 3px 10px; border-radius: 99px; font-size:12px; font-weight:600; }
.tb-badge-neutral{ background: var(--blush); color: var(--ink-soft); }
.tb-badge-good{ background: rgba(130,148,123,0.2); color: var(--sage); }
.tb-badge-warn{ background: rgba(169,92,103,0.15); color: var(--warn); }
.tb-badge-info{ background: rgba(105,68,95,0.12); color: var(--plum); }

.tb-empty{ text-align:center; padding: 44px 20px; color: var(--ink-soft); }
.tb-empty-icon{ font-size:38px; margin-bottom:10px; }
.tb-empty-title{ font-size:20px; color:var(--ink); margin-bottom:6px; }
.tb-empty-body{ font-size:14px; max-width:360px; margin:0 auto 16px; }

.tb-modal-backdrop{ position:fixed; inset:0; background: rgba(43,33,31,0.38); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; }
.tb-modal{ background: var(--card-raised); border-radius: var(--radius-l); padding: 22px; width:100%; max-height: 88vh; overflow-y:auto; box-shadow: var(--shadow-lift); }
.tb-modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }

.tb-field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.tb-field-label{ font-size:13px; font-weight:600; color: var(--ink-soft); }
.tb-field-hint{ font-size:12px; color: var(--ink-faint); }
.tb-input{ border: 1px solid var(--border); border-radius: var(--radius-s); padding: 11px 13px; font-size:14.5px; background: var(--bg); color: var(--ink); font-family: inherit; width:100%; }
.tb-input:focus{ border-color: var(--plum); }

.tb-tabs{ display:flex; gap:4px; background: var(--blush); padding:4px; border-radius: var(--radius-pill); width:fit-content; }
.tb-tab{ border:none; background:transparent; padding: 8px 16px; border-radius: 99px; cursor:pointer; font-size:13.5px; font-weight:600; color: var(--ink-soft); }
.tb-tab.active{ background: var(--card-raised); color: var(--plum); box-shadow: var(--shadow); }

.tb-toast-stack{ position:fixed; top:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px; }
.tb-toast{ background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--radius-m); font-size:14px; box-shadow: var(--shadow-lift); animation: tb-toast-in .2s ease; }
@keyframes tb-toast-in{ from{ opacity:0; transform: translateY(-6px);} to{ opacity:1; transform:none; } }

.tb-barchart{ display:flex; align-items:flex-end; gap:10px; }
.tb-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
.tb-bar{ width:100%; border-radius: 6px 6px 2px 2px; min-height:3px; transition: height .5s ease; }
.tb-bar-label{ font-size:11px; color: var(--ink-faint); }

.tb-tx-row{ display:flex; align-items:center; gap:12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.tb-tx-row:last-child{ border-bottom:none; }
.tb-tx-icon{ width:38px; height:38px; border-radius:50%; background: var(--blush); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tb-tx-main{ flex:1; min-width:0; }
.tb-tx-title{ font-weight:600; font-size:14.5px; }
.tb-tx-sub{ font-size:12.5px; color: var(--ink-faint); }
.tb-tx-amount{ font-weight:700; font-size:15px; white-space:nowrap; }
.tb-tx-amount.income{ color: var(--income); }
.tb-tx-amount.expense{ color: var(--ink); }

.tb-stat-label{ font-size:12.5px; color: var(--ink-faint); margin-bottom:4px; }
.tb-stat-value{ font-size: 26px; font-family: var(--font-display); }

.tb-chip{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:99px; border:1px solid var(--border); background:var(--card-raised); cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink-soft); }
.tb-chip.active{ background: var(--plum); color:#fff; border-color: var(--plum); }

.tb-month-switch{ display:flex; align-items:center; gap:10px; }
.tb-month-switch button{ background:none; border:1px solid var(--border); border-radius:50%; width:32px; height:32px; cursor:pointer; color:var(--ink-soft); }

.tb-badge-life{ font-size: 13px; }
</style>

<body>

<script type="text/babel" data-presets="react">
"use strict";
const { useState, useEffect } = React;

/* ---- data/models.js ---- */
/* ===========================================================
   TABBI DATA MODELS
   Shapes and constants only. See data/store.js for state.
=========================================================== */

const GROUPS = {
  INCOME: "INCOME",
  MUST_PAY: "MUST_PAY",
  MY_WANTS: "MY_WANTS",
  SAVINGS: "SAVINGS",
  INVESTMENTS: "INVESTMENTS",
};

const GROUP_LABELS = {
  INCOME: "Income",
  MUST_PAY: "Must Pay",
  MY_WANTS: "My Wants",
  SAVINGS: "Savings",
  INVESTMENTS: "Investments",
};

const TRANSACTION_TYPES = { INCOME: "income", EXPENSE: "expense" };

const ACCOUNT_TYPES = ["M-Pesa", "Bank", "SACCO", "Cash", "Other"];

const INCOME_SOURCE_TYPES = [
  "Salary", "Freelance", "Business", "Side Hustle",
  "Allowance", "Rental Income", "Commission", "Other",
];

const INVESTMENT_TYPES = [
  "Money Market Fund", "Treasury Bills", "Treasury Bonds",
  "SACCO", "Shares", "Pension", "Other",
];

const DEBT_TYPES = [
  "Bank Loan", "Mobile Loan", "Credit Card", "SACCO Loan",
  "HELB / Student Loan", "Personal Loan", "BNPL", "Other",
];

const INSURANCE_TYPES = [
  "Life Insurance", "Medical / Health Insurance", "Motor Insurance — Private",
  "Motor Insurance — Commercial", "Personal Accident", "Travel Insurance",
  "Property / Home Insurance", "Fire Insurance", "Theft / Burglary Insurance",
  "Agriculture / Crop Insurance", "Livestock Insurance", "Other",
];

const SINKING_FUND_TEMPLATES = [
  "Rent", "Insurance", "Christmas", "School Fees", "Travel",
  "Birthdays", "Car Maintenance", "Annual Subscriptions", "Medical Expenses",
];

const NOTE_CATEGORIES = [
  "Money Thought", "Spending Reflection", "Goal Check-In",
  "Money Lesson", "Money Gratitude",
];

const CURRENCIES = [
  { code: "KES", symbol: "KSh", name: "Kenyan Shilling" },
  { code: "USD", symbol: "$", name: "US Dollar" },
  { code: "GBP", symbol: "£", name: "British Pound" },
  { code: "EUR", symbol: "€", name: "Euro" },
  { code: "CAD", symbol: "CA$", name: "Canadian Dollar" },
  { code: "AUD", symbol: "A$", name: "Australian Dollar" },
  { code: "CHF", symbol: "CHF", name: "Swiss Franc" },
  { code: "AED", symbol: "AED", name: "UAE Dirham" },
  { code: "ZAR", symbol: "R", name: "South African Rand" },
  { code: "NGN", symbol: "₦", name: "Nigerian Naira" },
  { code: "TZS", symbol: "TSh", name: "Tanzanian Shilling" },
  { code: "UGX", symbol: "USh", name: "Ugandan Shilling" },
];

const SAVE_1M_CHALLENGE_ID = "save-1m";

const CHALLENGE_DEFS = [
  { id: SAVE_1M_CHALLENGE_ID, title: "Save Yourself First", icon: "💎", description: "The million milestone — one contribution at a time.", trackingType: "amount", targetAmount: 1000000, signature: true },
  { id: "no-spend-7", title: "7-Day No-Spend Challenge", days: 7, icon: "🚫", description: "Go seven days without a single non-essential purchase." },
  { id: "savings-30", title: "30-Day Savings Challenge", days: 30, icon: "💰", description: "Save something — anything — every day for a month." },
  { id: "track-7", title: "Track Every Expense — 7 Days", days: 7, icon: "🧾", description: "Log every shilling you spend for a week straight." },
  { id: "under-wants", title: "Stay Under Your My Wants Budget", days: 30, icon: "🛍️", description: "Finish the month at or under your My Wants planned amount." },
  { id: "no-impulse", title: "No Impulse Shopping Week", days: 7, icon: "🧘", description: "Sit on any non-essential purchase for 48 hours." },
  { id: "build-ef", title: "Build Your Emergency Fund", days: 30, icon: "🛟", description: "Make consistent contributions to your emergency fund." },
  { id: "debt-sprint", title: "Debt Payoff Sprint", days: 30, icon: "🪙", description: "Put extra toward your debt every week this month." },
  { id: "cook-home", title: "Cook At Home Challenge", days: 14, icon: "🍳", description: "Skip eating out for two weeks." },
  { id: "invest-monthly", title: "Invest Every Month Challenge", days: 30, icon: "📈", description: "Make at least one investment contribution this month." },
];

const MONTH_STATUS = { ACTIVE: "ACTIVE", CLOSED: "CLOSED" };

const DEFAULT_CATEGORIES = [
  { group: GROUPS.MUST_PAY, name: "Rent / Mortgage" },
  { group: GROUPS.MUST_PAY, name: "Electricity & Water" },
  { group: GROUPS.MUST_PAY, name: "Internet & Airtime" },
  { group: GROUPS.MUST_PAY, name: "Transport" },
  { group: GROUPS.MUST_PAY, name: "Groceries" },
  { group: GROUPS.MY_WANTS, name: "Eating Out" },
  { group: GROUPS.MY_WANTS, name: "Shopping" },
  { group: GROUPS.MY_WANTS, name: "Beauty" },
  { group: GROUPS.MY_WANTS, name: "Entertainment" },
  { group: GROUPS.SAVINGS, name: "Savings" },
  { group: GROUPS.INVESTMENTS, name: "Investments" },
];

/* ---- data/store.js ---- */
/* ===========================================================
   TABBI STORE
   A small, dependency-free data layer. localStorage today,
   swappable for a backend later without touching UI code —
   every screen talks to this module, never to localStorage.
=========================================================== */

const KEY = "tabbi:v1";

function uid(prefix) {
  return (prefix || "id") + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function monthId(year, month) { return year + "-" + String(month).padStart(2, "0"); }

function defaultCategoriesForMonth() {
  return DEFAULT_CATEGORIES.map(c => ({
    id: uid("cat"), group: c.group, name: c.name, planned: 0, custom: false,
  }));
}

function emptyState() {
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth() + 1;
  const id = monthId(y, mo);
  return {
    version: 1,
    onboarded: false,
    settings: {
      currency: "KES",
      displayName: "",
      theme: "light",
      personality: "Supportive",
      roastLevel: "Playful",
      pinEnabled: false,
      pin: null,
      notifications: {
        upcomingBill: true, goalMilestone: true, challengeProgress: true,
        budgetWarning: true, newMonth: true, recurringPayment: true, sinkingFundDeadline: true,
      },
    },
    accounts: [],
    incomeSources: [],
    transactions: [],
    months: {
      [id]: {
        id, year: y, month: mo, status: MONTH_STATUS.ACTIVE,
        categories: defaultCategoriesForMonth(),
        recurring: [],
        createdDate: now.toISOString(), closedDate: null,
        leftoverDecisions: {},
      },
    },
    currentMonthId: id,
    goals: { emergencyFund: null, sinkingFunds: [] },
    insurancePolicies: [],
    investments: [],
    debts: [],
    moneyNotes: [],
    challenges: { joined: [], custom: [] },
    netWorthSnapshots: [],
  };
}

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = typeof localStorage !== "undefined" ? localStorage.getItem(KEY) : null;
    if (!raw) return emptyState();
    const parsed = JSON.parse(raw);
    const base = emptyState();
    const merged = Object.assign(base, parsed);
    merged.settings = Object.assign({}, base.settings, parsed.settings || {});
    merged.settings.notifications = Object.assign({}, base.settings.notifications, (parsed.settings && parsed.settings.notifications) || {});
    merged.goals = Object.assign({}, base.goals, parsed.goals || {});
    merged.challenges = Object.assign({}, base.challenges, parsed.challenges || {});
    merged.challenges.joined = (parsed.challenges && parsed.challenges.joined) || [];
    merged.challenges.custom = (parsed.challenges && parsed.challenges.custom) || [];
    return merged;
  } catch (e) {
    console.error("Tabbi store load error", e);
    return emptyState();
  }
}

function persist() {
  try { if (typeof localStorage !== "undefined") localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { console.error("Tabbi persist error", e); }
  listeners.forEach(fn => fn(state));
}

function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
function getState() { return state; }

function set(mutator) {
  const draft = JSON.parse(JSON.stringify(state));
  mutator(draft);
  state = draft;
  persist();
}

// ---------- months ----------
function ensureMonth(year, month) {
  const id = monthId(year, month);
  if (state.months[id]) return id;
  set(d => {
    const prev = d.months[d.currentMonthId];
    d.months[id] = {

    if (tx.accountId) {

  });

/* ---- utils/calculations.js ---- */
/* ===========================================================
   TABBI CALCULATIONS
   Pure functions only — no side effects, no store access.
   Every number on screen should be traceable to one of these.
=========================================================== */

const CURRENCY_SYMBOLS = CURRENCIES.reduce((acc, c) => { acc[c.code] = c.symbol; return acc; }, {});

// Pure formatter — pass an explicit currency code (used for per-account
// amounts, since accounts can each hold a different currency).
function fmtMoney(n, currencyCode) {
  const v = Math.round(Number(n) || 0);
  const symbol = CURRENCY_SYMBOLS[currencyCode] || currencyCode || "KSh";
  return symbol + " " + v.toLocaleString("en-KE");
}

// Formats using the app's primary currency (Settings > Currency). Kept as
// `fmtKES` so every existing call site across the app (Home, Budget, Goals,
// Insurance, Debt, etc.) automatically shows the right symbol with zero
// changes needed at each call site.
function fmtKES(n) {
  const state = getState();
  return fmtMoney(n, (state && state.settings && state.settings.currency) || "KES");
}

function monthTxs(state, monthId) {
  const m = state.months[monthId];
  if (!m) return [];
  const prefix = m.year + "-" + String(m.month).padStart(2, "0");
  return state.transactions.filter(t => t.date && t.date.slice(0, 7) === prefix);
}

// ---------- Budget ----------
function budgetSummary(state, monthId) {
  const m = state.months[monthId];
  if (!m) return null;
  const txs = monthTxs(state, monthId);
  const cats = m.categories.map(c => {
    const spent = txs.filter(t => t.categoryId === c.id && t.type === "expense").reduce((s, t) => s + t.amount, 0);
    return { ...c, spent, remaining: c.planned - spent, pct: c.planned > 0 ? Math.min(999, (spent / c.planned) * 100) : (spent > 0 ? 100 : 0) };
  });
  const income = txs.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
  const totalPlanned = cats.reduce((s, c) => s + c.planned, 0);
  const totalSpent = cats.reduce((s, c) => s + c.spent, 0);
  const byGroup = {};
  Object.values(GROUPS).forEach(g => {
    const gc = cats.filter(c => c.group === g);
    byGroup[g] = { planned: gc.reduce((s, c) => s + c.planned, 0), spent: gc.reduce((s, c) => s + c.spent, 0), categories: gc };
  });
  return { categories: cats, byGroup, income, totalPlanned, totalSpent, remaining: income - totalSpent };
}

function incomeTotal(state, monthId) {
  return monthTxs(state, monthId).filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
}
function expenseTotal(state, monthId) {
  return monthTxs(state, monthId).filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);
}

// ---------- Emergency Fund ----------
function emergencyFundProgress(ef) {
  if (!ef) return null;
  const target = (ef.essentialMonthlyExpenses || 0) * (ef.targetMonths || 6);
  const saved = ef.savedAmount || 0;
  const remaining = Math.max(0, target - saved);
  const pct = target > 0 ? Math.min(100, (saved / target) * 100) : 0;
  const monthlyContribution = ef.monthlyContribution || 0;
  const monthsToGo = monthlyContribution > 0 ? Math.ceil(remaining / monthlyContribution) : null;
  let etaDate = null;
  if (monthsToGo != null) { const d = new Date(); d.setMonth(d.getMonth() + monthsToGo); etaDate = d; }
  return { target, saved, remaining, pct, monthlyContribution, monthsToGo, etaDate,
    status: pct >= 100 ? "complete" : (monthlyContribution <= 0 ? "no-plan" : "on-track") };
}

// ---------- Sinking Funds ----------
function sinkingFundProgress(fund) {
  const remaining = Math.max(0, fund.targetAmount - fund.savedAmount);
  const pct = fund.targetAmount > 0 ? Math.min(100, (fund.savedAmount / fund.targetAmount) * 100) : 0;
  let periodsLeft = null, requiredContribution = null;
  if (fund.dueDate) {
    const daysLeft = Math.max(0, Math.ceil((new Date(fund.dueDate) - new Date()) / 86400000));
    periodsLeft = fund.frequency === "Weekly" ? Math.max(1, Math.ceil(daysLeft / 7)) : Math.max(1, Math.ceil(daysLeft / 30.44));
    requiredContribution = remaining / periodsLeft;
  }
  let status = "on-track";
  if (pct >= 100) status = "complete";
  else if (fund.dueDate && new Date(fund.dueDate) < new Date()) status = "behind";
  return { remaining, pct, periodsLeft, requiredContribution, status };
}

// ---------- Insurance ----------
function insuranceProgress(policy) {
  const remaining = Math.max(0, policy.premiumAmount - policy.savedAmount);
  const pct = policy.premiumAmount > 0 ? Math.min(100, (policy.savedAmount / policy.premiumAmount) * 100) : 0;
  let daysUntilDue = null, requiredMonthly = null, status = "on-track";
  if (policy.nextDueDate) {
    daysUntilDue = Math.ceil((new Date(policy.nextDueDate) - new Date()) / 86400000);
    const monthsLeft = Math.max(1 / 30, daysUntilDue / 30.44);
    requiredMonthly = remaining / Math.max(1, Math.ceil(monthsLeft));
    if (daysUntilDue < 0 && pct < 100) status = "behind";
  }
  if (pct >= 100) status = "complete";
  return { remaining, pct, daysUntilDue, requiredMonthly, status };
}

// ---------- Debt Payoff Planner ----------
function debtPayoffPlan(debts, extraMonthly, method) {
  if (!debts || debts.length === 0) return { months: 0, milestones: [], totalInterest: 0 };
  let working = debts.map(d => ({ id: d.id, name: d.name, balance: d.balance, rate: d.interestRate || 0, minPayment: d.minPayment || 0 })).filter(d => d.balance > 0);
  const order = (method === "avalanche") ? working.slice().sort((a, b) => b.rate - a.rate) : working.slice().sort((a, b) => a.balance - b.balance);

  let month = 0, totalInterest = 0;
  const milestones = [];
  const maxMonths = 600;
  let extra = extraMonthly || 0;

  while (order.some(d => d.balance > 0.5) && month < maxMonths) {
    month++;
    let freed = extra;
    for (const d of order) {
      if (d.balance <= 0) continue;
      const interest = d.balance * (d.rate / 100 / 12);
      totalInterest += interest;
      d.balance += interest;
      let pay = d.minPayment;
      if (freed > 0) { pay += freed; freed = 0; }
      pay = Math.min(pay, d.balance);
      d.balance -= pay;
      if (d.balance <= 0.5 && !d.paidOffMonth) { d.balance = 0; d.paidOffMonth = month; milestones.push({ id: d.id, name: d.name, month }); }
    }
    extra = extra + order.filter(d => d.balance <= 0 && d.paidOffMonth === month).reduce((s, d) => s + d.minPayment, 0);
  }
  return { months: month, milestones, totalInterest: Math.round(totalInterest) };
}

// ---------- Net Worth ----------
function netWorth(state) {
  const assets = state.accounts.reduce((s, a) => s + (a.balance || 0), 0) + state.investments.reduce((s, i) => s + (i.balance || 0), 0);
  const liabilities = state.debts.reduce((s, d) => s + (d.balance || 0), 0);
  return { assets, liabilities, netWorth: assets - liabilities };
}

// ---------- Annual ----------
function annualSummary(state, year) {
  const months = Object.values(state.months).filter(m => m.year === year).sort((a, b) => a.month - b.month);
  const perMonth = months.map(m => {
    const income = incomeTotal(state, m.id);
    const expense = expenseTotal(state, m.id);
    const b = budgetSummary(state, m.id);
    const savings = b ? b.byGroup[GROUPS.SAVINGS].spent : 0;
    const invested = b ? b.byGroup[GROUPS.INVESTMENTS].spent : 0;
    return { month: m.month, income, expense, savings, invested };
  });
  const totals = perMonth.reduce((acc, m) => ({
    income: acc.income + m.income, expense: acc.expense + m.expense,
    savings: acc.savings + m.savings, invested: acc.invested + m.invested,
  }), { income: 0, expense: 0, savings: 0, invested: 0 });
  return { perMonth, totals };
}

function categoryBreakdownForYear(state, year) {
  const months = Object.values(state.months).filter(m => m.year === year);
  const totals = {};
  months.forEach(m => {
    const b = budgetSummary(state, m.id);
    b.categories.forEach(c => { totals[c.name] = (totals[c.name] || 0) + c.spent; });
  });
  return Object.entries(totals).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
}

// ---------- Insights ----------
function generateInsights(state, monthId) {
  const insights = [];
  const b = budgetSummary(state, monthId);
  if (!b) return insights;
  const m = state.months[monthId];
  const now = new Date();
  const daysInMonth = new Date(m.year, m.month, 0).getDate();
  const daysLeft = Math.max(0, daysInMonth - now.getDate());

  b.categories.forEach(c => {
    if (c.planned > 0 && c.pct >= 90 && c.pct < 100 && daysLeft > 3) {
      insights.push({ type: "warning", text: `Your ${c.name} budget is ${Math.round(c.pct)}% used and there are still ${daysLeft} days left.` });
    }
    if (c.pct >= 100) {
      insights.push({ type: "warning", text: `You've gone over budget on ${c.name} by ${fmtKES(c.spent - c.planned)}.` });
    }
  });

  if (b.remaining > 0 && b.income > 0) {
    insights.push({ type: "celebration", text: `You've got ${fmtKES(b.remaining)} left to plan for this month. Nice cushion.` });
  }
  if (b.totalSpent > 0 && b.totalPlanned > 0 && b.totalSpent < b.totalPlanned * 0.7 && daysLeft < 5) {
    insights.push({ type: "celebration", text: `You stayed well under budget this month. We love to see it.` });
  }

  (state.goals.sinkingFunds || []).forEach(f => {
    if (f.dueDate) {
      const days = Math.ceil((new Date(f.dueDate) - now) / 86400000);
      if (days >= 0 && days <= 14) insights.push({ type: "reminder", text: `${f.name} is due in ${days} day${days === 1 ? "" : "s"}.` });
    }
  });
  (state.insurancePolicies || []).forEach(p => {
    if (p.nextDueDate) {
      const days = Math.ceil((new Date(p.nextDueDate) - now) / 86400000);
      if (days >= 0 && days <= 14) insights.push({ type: "reminder", text: `${p.type} premium is due in ${days} day${days === 1 ? "" : "s"}.` });
    }
  });

  return insights;
}

// ---------- Annual insights (only from real data) ----------
function annualInsights(state, year) {
  const { perMonth } = annualSummary(state, year);
  const withData = perMonth.filter(m => m.income > 0 || m.expense > 0);
  const insights = [];
  if (withData.length >= 2) {
    const names = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const bestSavings = withData.slice().sort((a, b) => b.savings - a.savings)[0];
    if (bestSavings.savings > 0) insights.push(`You saved more in ${names[bestSavings.month - 1]} than any other month.`);
    const last = withData[withData.length - 1], prev = withData[withData.length - 2];
    if (last.expense > prev.expense * 1.15) insights.push(`Your spending increased in ${names[last.month - 1]}.`);
    const firstRate = prev.income > 0 ? prev.savings / prev.income : 0;
    const lastRate = last.income > 0 ? last.savings / last.income : 0;
    if (lastRate > firstRate && firstRate > 0) insights.push(`Your savings rate improved by ${Math.round((lastRate - firstRate) * 100)}%.`);
  }
  return insights;
}

// ---------- Challenges (generic: day-streak or amount-based) ----------
function challengeProgress(def, joinedRecord) {
  const progress = joinedRecord ? (joinedRecord.progress || 0) : 0;
  const completed = !!(joinedRecord && joinedRecord.completedAt);
  if (def.trackingType === "amount") {
    const target = def.targetAmount || 0;
    const remaining = Math.max(0, target - progress);
    const pct = target > 0 ? Math.min(100, (progress / target) * 100) : 0;
    const monthlyTarget = (joinedRecord && joinedRecord.monthlyTarget) || 0;
    const monthsToGo = monthlyTarget > 0 ? Math.ceil(remaining / monthlyTarget) : null;
    return { type: "amount", target, saved: progress, remaining, pct, monthlyTarget, monthsToGo, completed };
  }
  const target = def.days || 0;
  const pct = target > 0 ? Math.min(100, (progress / target) * 100) : 0;
  return { type: "days", target, progress, pct, completed };
}

function challengeMilestones(target) {
  return [0.1, 0.25, 0.5, 0.75, 1].map(f => ({ amount: Math.round((target || 0) * f), pct: Math.round(f * 100) }));
}

// ---------- Roast Me ----------
function generateRoasts(state, monthId, level) {
  const b = budgetSummary(state, monthId);
  if (!b) return [];
  const wants = b.byGroup[GROUPS.MY_WANTS];
  const lines = { GENTLE: [], PLAYFUL: [], BRUTAL: [] };

  if (wants && wants.planned > 0 && wants.spent > wants.planned) {
    const over = wants.spent - wants.planned;
    lines.GENTLE.push(`Okay bestie, My Wants went ${fmtKES(over)} over. We see you 😂`);
    lines.PLAYFUL.push(`Your My Wants budget saw ${fmtKES(over)} in overspending and immediately resigned.`);
    lines.BRUTAL.push(`At this point you're not budgeting. You're documenting the downfall of My Wants. 😭`);
  }
  const topCat = b.categories.slice().sort((a, c) => c.spent - a.spent)[0];
  if (topCat && topCat.spent > 0) {
    lines.GENTLE.push(`${topCat.name} was really out here taking most of your money this month.`);
    lines.PLAYFUL.push(`${topCat.name}: ${fmtKES(topCat.spent)} spent. Bold choice, no notes.`);
    lines.BRUTAL.push(`${fmtKES(topCat.spent)} on ${topCat.name}. Your future self would like a word.`);
  }
  if (b.income > 0 && b.totalSpent === 0) {
    lines.GENTLE.push("No transactions logged yet — Tabbi has nothing to roast (yet).");
    lines.PLAYFUL.push("You've added zero transactions. Even I need something to work with.");
    lines.BRUTAL.push("Ghosting your own budget isn't a strategy.");
  }
  const key = (level || "PLAYFUL").toUpperCase();
  return lines[key] && lines[key].length ? lines[key] : ["Add a few transactions and Tabbi will have plenty to say 👀"];
}

/* ---- utils/quickEntry.js ---- */

const INCOME_WORDS = ["got paid", "salary", "earned", "received", "income", "paid me", "freelance payment", "commission", "sold", "got a refund", "refund"];

const CATEGORY_KEYWORDS = {
  "Eating Out": ["lunch", "dinner", "breakfast", "restaurant", "food delivery", "takeaway", "kfc", "java", "eating out", "ate out", "chips", "nyama"],
  "Groceries": ["groceries", "supermarket", "naivas", "carrefour", "market"],
  "Transport": ["uber", "bolt", "matatu", "fuel", "petrol", "fare", "transport", "taxi"],
  "Shopping": ["shopping", "clothes", "shoes", "bought", "mall"],
  "Beauty": ["salon", "barber", "nails", "makeup", "beauty", "haircut"],
  "Entertainment": ["movie", "netflix", "cinema", "concert", "entertainment", "spotify"],
  "Electricity & Water": ["kplc", "electricity", "water bill", "token"],
  "Internet & Airtime": ["airtime", "data bundle", "wifi", "internet"],
  "Rent / Mortgage": ["rent", "mortgage"],
};

const ACCOUNT_KEYWORDS = {
  "M-Pesa": ["mpesa", "m-pesa"],
  "Bank": ["bank", "card"],
  "Cash": ["cash"],
  "SACCO": ["sacco"],
};

function parseQuickEntry(text, state) {
  const lower = text.toLowerCase();
  const amountMatch = lower.match(/(?:ksh|kes|sh)?\s?(\d[\d,]*(?:\.\d+)?)\s?(?:ksh|kes|\/-|bob)?/i);
  const amount = amountMatch ? Number(amountMatch[1].replace(/,/g, "")) : null;

  const isIncome = INCOME_WORDS.some(w => lower.includes(w));
  const type = isIncome ? "income" : "expense";

  let categoryName = null;
  for (const [cat, words] of Object.entries(CATEGORY_KEYWORDS)) {
    if (words.some(w => lower.includes(w))) { categoryName = cat; break; }
  }
  const month = getCurrentMonth();
  let category = categoryName ? month.categories.find(c => c.name === categoryName) : null;
  if (!category && !isIncome) category = month.categories.find(c => c.name === "Shopping") || month.categories[0];

  let accountName = null;
  for (const [acc, words] of Object.entries(ACCOUNT_KEYWORDS)) {
    if (words.some(w => lower.includes(w))) { accountName = acc; break; }
  }
  let account = accountName ? state.accounts.find(a => a.type === accountName || a.name.toLowerCase().includes(accountName.toLowerCase())) : null;
  if (!account && state.accounts.length) account = state.accounts[0];

  return {
    amount, type,
    categoryId: category ? category.id : null,
    accountId: account ? account.id : null,
    date: new Date().toISOString().slice(0, 10),
    note: text.trim(),
    confidence: amount != null ? "ok" : "needs-amount",
  };
}

let toastId = 0;

function useToasts() {
  const [toasts, setToasts] = useState([]);
  function push(message, tone) {
    const id = ++toastId;
    setToasts(t => [...t, { id, message, tone: tone || "default" }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }
  const node = (
    <div className="tb-toast-stack" aria-live="polite">
      {toasts.map(t => <div key={t.id} className={"tb-toast tb-toast-" + t.tone}>{t.message}</div>)}
    </div>
  );
  return [push, node];
}

function Donut({ value, max, size = 120, stroke = 14, color }) {
  const pct = max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={`${Math.round(pct * 100)} percent`}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--border)" strokeWidth={stroke} />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color || "var(--plum)"} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={c - pct * c} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset .6s ease" }} />
    </svg>
  );
}

function BarChart({ data, valueKey = "value", labelKey = "label", color, height = 160 }) {
  const max = Math.max(1, ...data.map(d => d[valueKey]));
  return (
    <div className="tb-barchart" style={{ height }} role="img" aria-label={data.map(d => `${d[labelKey]}: ${Math.round(d[valueKey])}`).join(", ")}>
      {data.map((d, i) => (
        <div className="tb-bar-col" key={i}>
          <div className="tb-bar" style={{ height: (d[valueKey] / max * 100) + "%", background: d.color || color || "var(--plum)" }} title={`${d[labelKey]}: ${d[valueKey]}`} />
          <div className="tb-bar-label">{d[labelKey]}</div>
        </div>
      ))}
    </div>
  );
}

function LineSpark({ points, width = 300, height = 80, color }) {
  if (!points.length) return null;
  const max = Math.max(...points, 1), min = Math.min(...points, 0);
  const range = max - min || 1;
  const step = width / Math.max(1, points.length - 1);
  const d = points.map((p, i) => `${i === 0 ? "M" : "L"} ${i * step} ${height - ((p - min) / range) * height}`).join(" ");
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
      <path d={d} fill="none" stroke={color || "var(--plum)"} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function MonthSwitcher({ state, onChange }) {
  const m = getMonth(state.currentMonthId);
  function shift(delta) {
    let year = m.year, month = m.month + delta;
    if (month < 1) { month = 12; year -= 1; }
    if (month > 12) { month = 1; year += 1; }
    const id = monthId(year, month);
    if (state.months[id]) onChange(id);
  }
  const nextId = monthId(m.month === 12 ? m.year + 1 : m.year, m.month === 12 ? 1 : m.month + 1);
  return (
    <div className="tb-month-switch">
      <button aria-label="Previous month" onClick={() => shift(-1)}>‹</button>
      <strong style={{ fontSize: 14.5 }}>{monthLabel(m)}</strong>
      <button aria-label="Next month" onClick={() => shift(1)} disabled={!state.months[nextId]}>›</button>
    </div>
  );
}

        <div>
          <h4 className="font-display" style={{ marginTop: 0 }}>Ready for next month?</h4>
          <p style={{ color: "var(--ink-soft)", fontSize: 14 }}>{monthLabel(month)}'s data stays exactly as it is — nothing gets erased. Confirm to open the new month.</p>
        </div>
      )}

      <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
        {step > 1 && <Button variant="ghost" onClick={back}>Back</Button>}
        {step < 6 && <Button full onClick={next}>Continue</Button>}
        {step === 6 && <Button full onClick={confirm}>Confirm & start new month</Button>}
      </div>
    </Modal>
  );
}

const DEF = CHALLENGE_DEFS.find(c => c.id === SAVE_1M_CHALLENGE_ID);

function SaveOneMillionCard({ state, toast, compact }) {
  const joined = state.challenges.joined.find(c => c.challengeId === SAVE_1M_CHALLENGE_ID);
  const [contribOpen, setContribOpen] = useState(false);
  const [amt, setAmt] = useState("");
  const [targetOpen, setTargetOpen] = useState(false);
  const [monthlyTarget, setMonthlyTarget] = useState((joined && joined.monthlyTarget) || "");

  const target = DEF.targetAmount;
  const saved = joined ? (joined.progress || 0) : 0;
  const remaining = Math.max(0, target - saved);
  const pct = target > 0 ? Math.min(100, (saved / target) * 100) : 0;
  const milestones = challengeMilestones(target);
  const completed = joined && joined.completedAt;

  function join() { joinChallenge(SAVE_1M_CHALLENGE_ID); toast("Challenge joined — let's build that million 💎"); }
  function contribute() {
    contributeChallengeProgress(SAVE_1M_CHALLENGE_ID, Number(amt) || 0, target);
    setContribOpen(false); setAmt("");
    toast("Nice — added toward your million 💎");
  }
  function saveTarget() {
    setChallengeMonthlyTarget(SAVE_1M_CHALLENGE_ID, Number(monthlyTarget) || 0);
    setTargetOpen(false);
    toast("Contribution target saved.");
  }

  return (
    <Card style={{ marginBottom: compact ? 0 : 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
        <div>
          <h3 className="font-display" style={{ margin: 0, fontSize: compact ? 17 : 20 }}>💎 Save Yourself First</h3>
          <p style={{ color: "var(--ink-soft)", fontSize: 13, margin: "4px 0 0" }}>The {fmtKES(target)} milestone.</p>
        </div>
        {completed ? <Badge tone="good">Completed 🎉</Badge> : joined ? <Badge tone="info">In progress</Badge> : <Badge tone="neutral">Not joined</Badge>}
      </div>

      {!joined ? (
        <Button size="sm" onClick={join}>Join the challenge</Button>
      ) : (
        <div>
          {!compact && (
            <div className="tb-grid tb-grid-3" style={{ marginBottom: 12 }}>
              <div><div className="tb-stat-label">Target</div><div className="tb-stat-value" style={{ fontSize: 18 }}>{fmtKES(target)}</div></div>
              <div><div className="tb-stat-label">Saved</div><div className="tb-stat-value" style={{ fontSize: 18 }}>{fmtKES(saved)}</div></div>
              <div><div className="tb-stat-label">Remaining</div><div className="tb-stat-value" style={{ fontSize: 18 }}>{fmtKES(remaining)}</div></div>
            </div>
          )}
          <ProgressBar pct={pct} color={completed ? "var(--sage)" : "var(--plum)"} height={compact ? 8 : 10} />
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "var(--ink-soft)", margin: "8px 0 12px" }}>
            <span>{Math.round(pct)}% funded</span>
            {joined.monthlyTarget ? <span>{fmtKES(joined.monthlyTarget)}/mo target</span> : null}
          </div>
          {!compact && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
              {milestones.map(m => (
                <span key={m.pct} className={"tb-chip" + (saved >= m.amount ? " active" : "")}>{m.pct}% · {fmtKES(m.amount)}</span>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <Button size="sm" onClick={() => setContribOpen(true)}>+ Add contribution</Button>
            {!compact && <Button size="sm" variant="ghost" onClick={() => setTargetOpen(true)}>Set contribution target</Button>}
          </div>
        </div>
      )}

      <Modal open={contribOpen} onClose={() => setContribOpen(false)} title="Add contribution" width={360}>
        <Field label={`Amount (${state.settings.currency})`}><Input type="number" value={amt} onChange={e => setAmt(e.target.value)} /></Field>
        <Button full onClick={contribute}>Add</Button>
      </Modal>

      <Modal open={targetOpen} onClose={() => setTargetOpen(false)} title="Monthly contribution target" width={360}>
        <Field label={`Amount (${state.settings.currency})`} hint="Tabbi uses this to estimate months remaining."><Input type="number" value={monthlyTarget} onChange={e => setMonthlyTarget(e.target.value)} /></Field>
        <Button full onClick={saveTarget}>Save target</Button>
      </Modal>
    </Card>
  );
}

function Budget({ state, toast }) {

  const month = getMonth(state.currentMonthId);
  const b = budgetSummary(state, month.id);
  const groupOrder = [GROUPS.MUST_PAY, GROUPS.MY_WANTS, GROUPS.SAVINGS, GROUPS.INVESTMENTS];

  function savePlanned() {
    updateCategory(month.id, editCat.id, { planned: Number(editCat.planned) || 0 });
    setEditCat(null);
    toast("Budget updated.");
  }

    if (!newCat.name.trim()) return;
    addCategory(month.id, newCat.group, newCat.name.trim(), Number(newCat.planned) || 0);

        return (

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                  <button onClick={() => setEditCat({ id: c.id, name: c.name, planned: c.planned })}
                    style={{ background: "none", border: "none", cursor: "pointer", fontWeight: 600, fontSize: 14.5, color: "var(--ink)", padding: 0 }}>
                    {c.name}
                  </button>
                  <span style={{ fontSize: 13, color: "var(--ink-soft)" }}>Planned {fmtKES(c.planned)} · Spent {fmtKES(c.spent)} · Remaining {fmtKES(c.remaining)}</span>
                </div>
                <ProgressBar pct={c.pct} color={c.pct >= 100 ? "var(--warn)" : g === GROUPS.MY_WANTS ? "var(--rose)" : "var(--sage)"} />
              </div>
            ))}
          </Card>
        );

      </Modal>

/* ---- features/Challenges/Challenges.jsx ---- */

function Challenges({ state, toast }) {
  const joined = state.challenges.joined;
  const [createOpen, setCreateOpen] = useState(false);
  const [form, setForm] = useState({ name: "", icon: "🎯", trackingType: "days", days: "", targetAmount: "", deadline: "" });
  const [contribFor, setContribFor] = useState(null);
  const [contribAmt, setContribAmt] = useState("");
  const [delId, setDelId] = useState(null);

  const otherDefs = CHALLENGE_DEFS.filter(d => d.id !== SAVE_1M_CHALLENGE_ID);
  const allChallenges = [...otherDefs, ...state.challenges.custom];

  function isJoined(id) { return joined.find(c => c.challengeId === id); }

  function join(def) {
    joinChallenge(def.id);
    toast(`Joined "${def.title}" — let's go! 🔥`);
  }

  function bumpProgress(def) {
    const jc = isJoined(def.id);
    const next = Math.min(def.days, (jc.progress || 0) + 1);
    updateChallengeProgress(def.id, next, def.days);
    if (next >= def.days) toast(`You just completed "${def.title}" 🎉`);
    else toast(`${next} day${next === 1 ? "" : "s"} tracked 🔥`);
  }

  function contribute() {
    const def = allChallenges.find(d => d.id === contribFor);
    contributeChallengeProgress(contribFor, Number(contribAmt) || 0, def.targetAmount);
    setContribFor(null);
    setContribAmt("");
    toast("Contribution added 🎉");
  }

  function saveCustomChallenge() {
    if (!form.name.trim()) return;
    let days = null, targetAmount = null;
    if (form.trackingType === "days") {
      days = form.deadline ? Math.max(1, Math.ceil((new Date(form.deadline) - new Date()) / 86400000)) : (Number(form.days) || 7);
    } else {
      targetAmount = Number(form.targetAmount) || 0;
    }
    addCustomChallenge({ title: form.name.trim(), icon: form.icon || "🎯", trackingType: form.trackingType, days, targetAmount, deadline: form.deadline || null });
    setCreateOpen(false);
    setForm({ name: "", icon: "🎯", trackingType: "days", days: "", targetAmount: "", deadline: "" });
    toast("Challenge created — join it whenever you're ready.");
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <p style={{ color: "var(--ink-soft)", margin: 0 }}>Small money habits, made fun.</p>
        <Button onClick={() => setCreateOpen(true)}>+ Create Challenge</Button>
      </div>

      <SaveOneMillionCard state={state} toast={toast} />

      <div className="tb-grid tb-grid-3">
        {allChallenges.map(def => {
          const jc = isJoined(def.id);
          const isAmount = def.trackingType === "amount";
          const prog = challengeProgress(def, jc);
          const completed = jc && jc.completedAt;
          return (
            <Card key={def.id}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div style={{ fontSize: 26, marginBottom: 6 }}>{def.icon}</div>
                {def.custom && <Button size="sm" variant="ghost" onClick={() => setDelId(def.id)}>Delete</Button>}
              </div>
              <h3 className="font-display" style={{ margin: "0 0 4px", fontSize: 17 }}>{def.title}</h3>
              <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 12px" }}>{def.description}</p>
              {jc ? (
                <div>
                  <ProgressBar pct={prog.pct} color={completed ? "var(--sage)" : "var(--plum)"} />
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "var(--ink-soft)", margin: "8px 0 12px" }}>
                    <span>{isAmount ? `${fmtKES(prog.saved)} / ${fmtKES(prog.target)}` : `${prog.progress} / ${prog.target} days`}</span>
                    {completed ? <Badge tone="good">Completed 🎉</Badge> : <Badge tone="neutral">In progress</Badge>}
                  </div>
                  {isAmount && !completed && (
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                      {challengeMilestones(def.targetAmount).map(m => (
                        <span key={m.pct} className={"tb-chip" + (prog.saved >= m.amount ? " active" : "")}>{m.pct}%</span>
                      ))}
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 8 }}>
                    {!completed && isAmount && <Button size="sm" onClick={() => setContribFor(def.id)}>+ Contribute</Button>}
                    {!completed && !isAmount && <Button size="sm" onClick={() => bumpProgress(def)}>Log today</Button>}
                    <Button size="sm" variant="ghost" onClick={() => { leaveChallenge(def.id); toast("Left the challenge."); }}>Leave</Button>
                  </div>
                </div>
              ) : (
                <Button size="sm" onClick={() => join(def)}>Join challenge</Button>
              )}
            </Card>
          );
        })}
      </div>

      <Modal open={createOpen} onClose={() => setCreateOpen(false)} title="Create your own challenge" width={420}>
        <Field label="Name"><Input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="e.g. No Boda Boda Month" /></Field>
        <Field label="Icon (emoji, optional)"><Input value={form.icon} onChange={e => setForm({ ...form, icon: e.target.value })} maxLength={2} /></Field>
        <Field label="Tracking type">
          <Select value={form.trackingType} onChange={e => setForm({ ...form, trackingType: e.target.value })}>
            <option value="days">Day streak — log progress daily</option>
            <option value="amount">Save an amount — track contributions</option>
          </Select>
        </Field>
        {form.trackingType === "days" ? (
          <div>
            <Field label="Duration (days)" hint="Or set a deadline below instead"><Input type="number" value={form.days} onChange={e => setForm({ ...form, days: e.target.value })} placeholder="7" /></Field>
            <Field label="Deadline (optional)"><Input type="date" value={form.deadline} onChange={e => setForm({ ...form, deadline: e.target.value })} /></Field>
          </div>
        ) : (
          <Field label={`Target amount (${state.settings.currency})`}><Input type="number" value={form.targetAmount} onChange={e => setForm({ ...form, targetAmount: e.target.value })} /></Field>
        )}
        <Button full onClick={saveCustomChallenge}>Create challenge</Button>
      </Modal>

      <Modal open={!!contribFor} onClose={() => setContribFor(null)} title="Add contribution" width={360}>
        <Field label={`Amount (${state.settings.currency})`}><Input type="number" value={contribAmt} onChange={e => setContribAmt(e.target.value)} /></Field>
        <Button full onClick={contribute}>Add</Button>
      </Modal>

      <ConfirmDialog open={!!delId} onClose={() => setDelId(null)} title="Delete this challenge?" body="This can't be undone." danger confirmLabel="Delete"
        onConfirm={() => { deleteCustomChallenge(delId); toast("Challenge deleted."); }} />
    </div>
  );
}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <Select value={year} onChange={e => setYear(Number(e.target.value))} style={{ width: 140 }}>
          {years.length ? years.map(y => <option key={y} value={y}>{y}</option>) : <option value={year}>{year}</option>}
        </Select>
        <Tabs value={view} onChange={setView} items={[{ value: "year", label: "Year" }, { value: "category", label: "Category" }, { value: "month", label: "Month" }]} />
      </div>

      {!hasData ? (
        <Card><EmptyState icon="📊" title={`No data for ${year} yet`} body="Once you log income and expenses this year, your annual picture builds automatically." /></Card>
      ) : (
        <div>
          <Card style={{ marginBottom: 16 }}>
            <h3 className="font-display" style={{ margin: "0 0 12px", fontSize: 20 }}>{year} Money Year</h3>
            <div className="tb-grid tb-grid-4">
              <div><div className="tb-stat-label">Total income</div><div className="tb-stat-value" style={{ fontSize: 20 }}>{fmtKES(summary.totals.income)}</div></div>
              <div><div className="tb-stat-label">Total spending</div><div className="tb-stat-value" style={{ fontSize: 20 }}>{fmtKES(summary.totals.expense)}</div></div>
              <div><div className="tb-stat-label">Total saved</div><div className="tb-stat-value" style={{ fontSize: 20 }}>{fmtKES(summary.totals.savings)}</div></div>
              <div><div className="tb-stat-label">Total invested</div><div className="tb-stat-value" style={{ fontSize: 20 }}>{fmtKES(summary.totals.invested)}</div></div>
            </div>
          </Card>

          {view === "year" && (
            <Card style={{ marginBottom: 16 }}>
              <h4 className="font-display" style={{ marginTop: 0 }}>Monthly trends</h4>
              <BarChart data={summary.perMonth.map(m => ({ label: MONTH_ABBR[m.month - 1], value: m.income }))} color="var(--sage)" />
              <p style={{ fontSize: 12.5, color: "var(--ink-faint)", marginTop: 8 }}>Income by month</p>
            </Card>
          )}

          {view === "category" && (
            <Card style={{ marginBottom: 16 }}>
              <h4 className="font-display" style={{ marginTop: 0 }}>Annual category breakdown</h4>
              {catBreakdown.map(c => (
                <div key={c.name} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, marginBottom: 4 }}><span>{c.name}</span><span>{fmtKES(c.value)}</span></div>
                  <ProgressBar pct={catBreakdown[0].value > 0 ? (c.value / catBreakdown[0].value) * 100 : 0} />
                </div>
              ))}
            </Card>
          )}

          {view === "month" && (
            <Card style={{ marginBottom: 16 }}>
              <h4 className="font-display" style={{ marginTop: 0 }}>Month by month</h4>
              {summary.perMonth.map(m => (
                <div key={m.month} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--border)" }}>
                  <span>{MONTH_ABBR[m.month - 1]}</span>
                  <span style={{ color: "var(--ink-soft)" }}>Income {fmtKES(m.income)} · Spent {fmtKES(m.expense)}</span>
                </div>
              ))}
            </Card>
          )}

          {insights.length > 0 && (
            <Card>
              <h4 className="font-display" style={{ marginTop: 0 }}>Annual insights</h4>
              {insights.map((t, i) => <p key={i} style={{ fontSize: 14 }}>{t}</p>)}
            </Card>
          )}
        </div>
      )}
    </div>
  );
}

function History({ state, initialTab }) {
  const [tab, setTab] = useState(initialTab || "history");
  return (
    <div>
      <Tabs value={tab} onChange={setTab} items={[{ value: "history", label: "Money History" }, { value: "annual", label: "Annual View" }]} />
      <div style={{ height: 16 }} />
      {tab === "history" ? <MoneyHistory state={state} /> : <AnnualView state={state} />}
    </div>
  );
}

/* ---- App.jsx ---- */

const TITLES = {
  home: "Home", budget: "Budget", goals: "Goals", money: "Money", investments: "Investments",
  debt: "Debt", insurance: "Insurance", networth: "Net Worth", insights: "Insights",
  challenges: "Challenges", roastme: "Roast Me", notes: "Money Notes", more: "More",
  settings: "Settings", history: "Money History", annual: "Annual View", help: "How Tabbi Works",
};

function App() {
  const state = useTabbiState();
  const [route, setRoute] = useState("home");
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [addMoneyOpen, setAddMoneyOpen] = useState(false);
  const [startMonthOpen, setStartMonthOpen] = useState(false);
  const [toast, toastNode] = useToasts();

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", state.settings.theme);
  }, [state.settings.theme]);

  function toggleTheme() {
    updateSettings({ theme: state.settings.theme === "dark" ? "light" : "dark" });
  }

  if (!state.onboarded) {
    return <Onboarding onDone={() => {}} />;
  }

  const commonProps = { state, toast, setRoute };

  let screen;
  switch (route) {
    case "home": screen = <Home {...commonProps} onAddMoney={() => setAddMoneyOpen(true)} onStartNewMonth={() => setStartMonthOpen(true)} />; break;
    case "budget": screen = <Budget {...commonProps} />; break;
    case "money": screen = <Money {...commonProps} />; break;
    case "goals": screen = <Goals {...commonProps} />; break;
    case "insurance": screen = <Insurance {...commonProps} />; break;
    case "investments": screen = <Investments {...commonProps} />; break;
    case "debt": screen = <Debt {...commonProps} />; break;
    case "networth": screen = <NetWorth {...commonProps} />; break;
    case "insights": screen = <Insights {...commonProps} />; break;
    case "challenges": screen = <Challenges {...commonProps} />; break;
    case "roastme": screen = <RoastMe {...commonProps} />; break;
    case "notes": screen = <MoneyNotes {...commonProps} />; break;
    case "more": screen = <More setRoute={setRoute} />; break;
    case "settings": screen = <Settings {...commonProps} onToggleTheme={toggleTheme} />; break;
    case "history": screen = <History state={state} initialTab="history" />; break;
    case "annual": screen = <History state={state} initialTab="annual" />; break;
    case "help": screen = <Help />; break;
    default: screen = <Home {...commonProps} onAddMoney={() => setAddMoneyOpen(true)} onStartNewMonth={() => setStartMonthOpen(true)} />;
  }

  return (
    <div className="tb-app">
      <Sidebar route={route} setRoute={setRoute} state={state} setCurrentMonthId={setCurrentMonth} />
      <MobileDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} route={route} setRoute={setRoute} />
      <main className="tb-main">
        <TopBar title={TITLES[route] || "Tabbi"} onMenu={() => setDrawerOpen(true)}
          onAddMoney={() => setAddMoneyOpen(true)} onToggleTheme={toggleTheme} theme={state.settings.theme} />
        <div className="tb-page">{screen}</div>
      </main>
      <MobileNav route={route} setRoute={setRoute} />

      <AddMoneyModal open={addMoneyOpen} onClose={() => setAddMoneyOpen(false)} state={state} toast={toast} />
      <StartNewMonthModal open={startMonthOpen} onClose={() => setStartMonthOpen(false)} state={state} toast={toast} onDone={() => setRoute("home")} />
      {toastNode}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(React.StrictMode, null, React.createElement(App)));

</script>
</body>
</html>
